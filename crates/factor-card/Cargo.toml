[package]
name = "factor-card"
version = "0.1.0"
edition = "2021"
rust-version = "1.77"

[lib]
name = "factor_card"

[dependencies]
serde_json = "1.0"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd", "png-format"] }
ab_glyph = "0.2"
# 立繪解碼。tiny-skia 的 decode_png 回的是預乘 RGBA，而 Portrait 要非預乘的，
# 所以不共用它那份而是直接開 png crate。
png = "0.17"

[dev-dependencies]
ureq = "2.10"
